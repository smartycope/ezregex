version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

  # Install dependencies
  jobs:
    pre_build:
      - pip install pdoc mkdocs mkdocs-material mkdocs-gen-files mkdocstrings mkdocstrings-python mkdocs-include-markdown-plugin
      # - pip install mkdocs-theme-readthedocs
      - cp README.md docs/index.md
      - rm "docs/Other Utilities/index.md"

mkdocs:
  configuration: mkdocs.yml

